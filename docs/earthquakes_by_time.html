<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Earthquakes in Israel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" />
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Assistant', Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    #floating-title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Assistant', Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      text-align: center;
    }

    #title-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    #lang-toggle {
      padding: 3px 8px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
    }

    #lang-toggle:hover {
      background: #0056b3;
    }

    #csv-link {
      padding: 3px 8px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      display: inline-block;
    }

    #csv-link:hover {
      background: #218838;
    }
  </style>
</head>

<body>
  <div id="floating-title">
    <div id="title-header">
      <div id="main-title"></div>
      <button id="lang-toggle" onclick="toggleLanguage()">English</button>
      <a id="csv-link" href="https://github.com/yuval-harpaz/alarms/blob/master/data/earthquakes.csv" target="_blank">CSV</a>
    </div>
    <div id="title-rest"></div>
  </div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    let currentLang = 'he';
    let layerControl;
    let lastQuakeTime = null;
    let earthquakeData = []; // stores {row, group, eventTime} for re-filtering

    const map = L.map('map').setView([31.5, 34.75], 7.5);

    // GovMap Tiles (Hebrew)
    const govmapTiles = L.tileLayer('https://cdnil.govmap.gov.il/xyz/heb/{z}/{x}/{y}.png', {
      maxZoom: 16,
      attribution: '© המרכז למיפוי ישראל www.govmap.gov.il'
    });

    // CartoDB Tiles (English)
    const cartodbTiles = L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="http://cartodb.com/attributions">CartoDB</a>',
      subdomains: 'abcd',
      maxZoom: 19
    });

    // Start with Hebrew tiles
    govmapTiles.addTo(map);

    // Auto-switch tiles on zoom: GovMap lacks tiles at low zoom levels
    const HEBREW_MIN_ZOOM = 8;
    map.on('zoomend', function () {
      if (currentLang === 'he') {
        if (map.getZoom() < HEBREW_MIN_ZOOM) {
          if (map.hasLayer(govmapTiles)) {
            map.removeLayer(govmapTiles);
            map.addLayer(cartodbTiles);
          }
        } else {
          if (!map.hasLayer(govmapTiles)) {
            map.removeLayer(cartodbTiles);
            map.addLayer(govmapTiles);
          }
        }
      }
    });

    // Define overlapping layers for legend toggle
    const layers = {
      'one day': L.layerGroup(),
      'one week': L.layerGroup(),
      'one month': L.layerGroup(),
      'one year': L.layerGroup(),
      'more than a year': L.layerGroup()
    };

    const colors = {
      'one day': '#000000',
      'one week': '#FF0000',
      'one month': '#FFBF80',
      'one year': '#00FF80',
      'more than a year': '#0000FF'
    };

    const opacities = {
      'one day': 1.0,
      'one week': 1.0,
      'one month': 1.0,
      'one year': 1.0,
      'more than a year': 0.2
    };

    // Add layers oldest-first so recent events render on top
    ['more than a year', 'one year', 'one month', 'one week', 'one day'].forEach(k => layers[k].addTo(map));

    // Language-specific text
    const translations = {
      he: {
        title: 'רעידות אדמה שנרשמו בישראל מאז 2000',
        source: 'נתונים מ<a href="https://eq.gsi.gov.il/" target="_blank">המכון הגיאולוגי</a>',
        lastQuake: 'רעידה אחרונה',
        oneDay: 'יום אחד',
        oneWeek: 'שבוע אחד',
        oneMonth: 'חודש אחד',
        oneYear: 'שנה אחת',
        moreThanYear: 'יותר משנה',
        depth: 'עומק',
        buttonText: 'En',
        minMag: 'עצמה',
        all: 'הכל',
        felt: 'הורגש'
      },
      en: {
        title: 'Earthquakes recorded in Israel since 2000',
        source: 'Data from <a href="https://eq.gsi.gov.il/" target="_blank">THE GEOLOGICAL SURVEY OF ISRAEL</a>',
        lastQuake: 'last quake',
        oneDay: 'one day',
        oneWeek: 'one week',
        oneMonth: 'one month',
        oneYear: 'one year',
        moreThanYear: 'more than a year',
        depth: 'depth',
        buttonText: 'עב',
        minMag: 'min mag',
        all: 'all',
        felt: 'felt'
      }
    };

    function updateLanguage() {
      const t = translations[currentLang];
      
      // Update title
      document.getElementById('main-title').innerHTML = t.title;
      let restHTML = t.source;
      if (lastQuakeTime) {
        const lastQuakeStr = lastQuakeTime.toISOString().substring(0, 16).replace('T', ' ');
        restHTML += `<br>${t.lastQuake}: ${lastQuakeStr}`;
      }
      document.getElementById('title-rest').innerHTML = restHTML;
      document.getElementById('lang-toggle').textContent = t.buttonText;

      // Update layer control
      if (layerControl) {
        map.removeControl(layerControl);
      }

      const overlays = {
        [`<span style="color: #000000;">${t.oneDay}</span>`]: layers['one day'],
        [`<span style="color: #FF0000;">${t.oneWeek}</span>`]: layers['one week'],
        [`<span style="color: #FFBF80;">${t.oneMonth}</span>`]: layers['one month'],
        [`<span style="color: #00FF80;">${t.oneYear}</span>`]: layers['one year'],
        [`<span style="color: #0000FF;">${t.moreThanYear}</span>`]: layers['more than a year']
      };

      layerControl = L.control.layers(null, overlays, { collapsed: false, position: 'topleft' }).addTo(map);

      // Update mag filter labels if the control is already in the DOM
      const magLabel = document.getElementById('mag-filter-label');
      const magFilter = document.getElementById('mag-filter');
      if (magLabel && magFilter) {
        magLabel.textContent = t.minMag;
        magFilter.querySelector('option[value="all"]').textContent = t.all;
        magFilter.querySelector('option[value="felt"]').textContent = t.felt;
      }
    }

    function toggleLanguage() {
      currentLang = currentLang === 'he' ? 'en' : 'he';
      
      // Switch tiles
      if (currentLang === 'he') {
        map.removeLayer(cartodbTiles);
        map.addLayer(govmapTiles);
      } else {
        map.removeLayer(govmapTiles);
        map.addLayer(cartodbTiles);
      }
      
      updateLanguage();
    }

    // Initialize with Hebrew
    updateLanguage();

    // Magnitude filter control (placed below the layer control in top-left)
    const MagFilterControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function () {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.style.cssText = 'background:white;padding:5px 8px;font-family:\'Assistant\',Arial,sans-serif;font-size:12px;';
        div.innerHTML = `<label id="mag-filter-label" style="display:block;margin-bottom:3px;font-weight:bold;">min mag</label>
          <select id="mag-filter" style="width:100%;padding:2px 4px;font-size:12px;cursor:pointer;">
            <option value="2" selected>M ≥ 2</option>
            <option value="all">all</option>
            <option value="felt">felt</option>
            <option value="3">M ≥ 3</option>
            <option value="4">M ≥ 4</option>
            <option value="5">M ≥ 5</option>
            <option value="6">M ≥ 6</option>
            <option value="7">M ≥ 7</option>
          </select>`;
        L.DomEvent.disableClickPropagation(div);
        div.querySelector('#mag-filter').addEventListener('change', function () {
          applyMagFilter(this.value);
        });
        return div;
      }
    });
    new MagFilterControl().addTo(map);

    function applyMagFilter(filter) {
      // Clear all layer groups
      Object.values(layers).forEach(l => l.clearLayers());

      // Re-add markers that pass the filter, oldest-first (so recent render on top)
      earthquakeData.forEach(({ row, group, eventTime }) => {
        let show = false;
        if (filter === 'all') {
          show = true;
        } else if (filter === 'felt') {
          show = row.felt !== null && row.felt !== '' && row.felt !== undefined;
        } else {
          show = (row.magnitude || 0) >= parseFloat(filter);
        }
        if (!show) return;

        const mag = row.magnitude || 0;
        const radius = Math.max(3, Math.pow(mag, 2) / 2);
        const depthStr = row.depth > 0 ? `, depth: ${row.depth.toFixed(1)}Km` : '';
        const tooltip = `${eventTime.toISOString().replace('T', ' ').substring(0, 16)}<br>M: ${mag}${depthStr}`;
        const color = colors[group];
        const opacity = opacities[group];

        L.circleMarker([row.latitude, row.longitude], {
          radius, fillColor: color, color, weight: 1, opacity, fillOpacity: opacity
        }).bindTooltip(tooltip).addTo(layers[group]);
      });
    }

    // Load data
    Papa.parse('https://raw.githubusercontent.com/yuval-harpaz/alarms/refs/heads/master/data/earthquakes.csv', {
      download: true,
      header: true,
      dynamicTyping: true,
      skipEmptyLines: true,
      complete: function (results) {
        const now = new Date();

        // Sort oldest-first so recent markers render on top
        results.data.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        results.data.forEach(row => {
          if (!row.latitude || !row.longitude) return;

          const eventTime = new Date(row.timestamp);
          const diffDays = (now - eventTime) / (1000 * 60 * 60 * 24);

          if (!lastQuakeTime || eventTime > lastQuakeTime) {
            lastQuakeTime = eventTime;
          }

          let group = 'more than a year';
          if (diffDays <= 1) group = 'one day';
          else if (diffDays <= 7) group = 'one week';
          else if (diffDays <= 30) group = 'one month';
          else if (diffDays <= 365) group = 'one year';

          earthquakeData.push({ row, group, eventTime });
        });

        // Apply default filter (M ≥ 2)
        applyMagFilter('2');

        // Update title with last quake time after data loads
        updateLanguage();
      }
    });
  </script>
  </script>
</body>

</html>
