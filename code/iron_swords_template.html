                alert("Invalid format. Please use 'lat, lon' or 'lat lon'");
                return;
            }
            jumpTo(coords[0], coords[1]);
            coordJumpBox.style.display = 'none';
            coordInput.value = '';
        });

        document.addEventListener('mousedown', function (e) {
            if (coordJumpBox.style.display === 'block' && !coordJumpBox.contains(e.target)) {
                coordJumpBox.style.display = 'none';
            }
        });

        function focusOnPid(pid) {
            const wanted = String(pid).trim().replace(/\.0$/, '');
            for (const item of allFeatures) {
                if (item.people.some(p => String(p.p) === wanted)) {
                    focusFeature(item);
                    return true;
                }
            }
            return false;
        }

        const controls = document.getElementById('controls');
        document.getElementById('controls-head').onclick = () => {
            controls.classList.toggle('open');
        };

        /* ----------------------------------------------------------- the url */

        // ?front=Gaza&role=חייל&status=killed&from=2023-10-07&to=2023-10-09
        // &date=dd  (filter on the death date instead of the event date)
        // &pid=964  (open that person)
        // &zoom=13  (open at that zoom, and the zoom the map writes back)
        // Values are compared case-insensitively and may be comma separated.
        // A name that matches nothing is reported in the console rather than
        // silently emptying the map.
        const URL_FILTERS = { front: 'f', role: 'r', status: 's' };

        function applyUrlParams(params) {
            let touched = false;

            for (const name in URL_FILTERS) {
                const raw = params.get(name);
                if (raw === null) continue;
                const key = URL_FILTERS[name];
                const wanted = raw.split(',').map(v => v.trim().toLowerCase())
                    .filter(Boolean);
                const known = Object.keys(boxes[key]);
                const missing = wanted.filter(w =>
                    !known.some(v => v.toLowerCase() === w));
                if (missing.length) {
                    console.warn('unknown ' + name + ': ' + missing.join(', ') +
                        '. known values: ' + known.join(', '));
                }
                known.forEach(v => {
                    const keep = wanted.some(w => w === v.toLowerCase());
                    boxes[key][v].checked = keep;
                    if (keep) selected[key].delete(v);
                    else selected[key].add(v);
                });
                touched = true;
            }

            const field = params.get('date');
            if (field === 'dd' || field === 'd') {
                dateField = field;
                document.querySelector('input[name=datefield][value=' + field + ']')
                    .checked = true;
                touched = true;
            }

            const from = params.get('from'), to = params.get('to');
            if (from || to) {
                setRange(from || CONFIG.date_min, to || CONFIG.date_max, true);
                touched = true;
            }
            return touched;
        }

        // A filtered arrival is framed to what it actually shows. CONFIG.region
        // is the same box the build centres on -- a victim in the UAE or in
        // Egypt would otherwise pull the view back to a continent and leave the
        // real subject a speck. maxZoom stops a single survivor from filling the
        // screen at street level.
        const FIT_MAX_ZOOM = 14;

        function inRegion(latlng) {
            const box = CONFIG.region;
            return latlng.lat >= box.south && latlng.lat <= box.north
                && latlng.lng >= box.west && latlng.lng <= box.east;
        }

        function fitToVisible() {
            const points = [];
            allFeatures.forEach(feature => {
                const layer = feature.layer;
                if (!layer) return;
                if (layer.getLatLng) {
                    points.push(layer.getLatLng());
                } else if (layer.getBounds) {
                    const box = layer.getBounds();
                    points.push(box.getNorthEast(), box.getSouthWest());
                }
            });
            const inside = points.filter(inRegion);
            // Everything left out of the region is still on the map, just not
            // allowed to decide the framing. If that is all there is, leave the
            // view where the median put it.
            if (!inside.length) return;
            map.fitBounds(L.latLngBounds(inside),
                          { padding: [25, 25], maxZoom: FIT_MAX_ZOOM });
        }

        // The zoom lives in the address bar so it can be read off the screen
        // and shared back. Written on a zoom the reader asks for -- wheel,
        // buttons, keyboard, a double click -- and never at load: a number
        // appearing in a url nobody typed reads as a filter they set.
        // replaceState, so zooming does not fill the back button.
        let zoomToUrl = false;

        map.on('zoomend', function () {
            if (!zoomToUrl) return followZoom();   // still booting: wait again
            const url = new URL(window.location.href);
            url.searchParams.set('zoom', map.getZoom());
            history.replaceState(null, '', url);
        });

        // Every view the boot sets -- the framing of a filtered arrival, a pid
        // focus -- is programmatic, and leaflet finishes an animated one well
        // after the call returns. The url starts following once the map has
        // been quiet for half a second, and any zoom arriving before then is
        // taken as more boot and starts the wait over.
        let settling;

        function followZoom() {
            clearTimeout(settling);
            settling = setTimeout(() => { zoomToUrl = true; }, 500);
        }

        function applyUrlZoom(params) {
            const raw = params.get('zoom');
            if (raw === null) return false;
            const wanted = Number(raw);
            if (!Number.isFinite(wanted)) {
                console.warn('zoom is not a number: ' + raw);
                return false;
            }
            const zoom = Math.min(Math.max(wanted, map.getMinZoom()),
                                  map.getMaxZoom());
            if (zoom !== wanted) console.warn('zoom clamped to ' + zoom);
            map.setZoom(zoom);
            return true;
        }

        /* --------------------------------------------------------------- boot */

        buildFilters();
        buildCampaigns();
        buildLegend();
        setRange(CONFIG.date_min, CONFIG.date_max, true);

        const params = new URLSearchParams(window.location.search);
        // Opened with a filter in the url: show the panel, so it is obvious the
        // map is not showing everything.
        const filtered = applyUrlParams(params);
        if (filtered) controls.classList.add('open');

        markActiveCampaign();
        render();
        if (filtered) fitToVisible();
        // After the framing, not before: a zoom in the url was asked for by
        // name, and fitToVisible would otherwise overrule it.
        applyUrlZoom(params);

        const pidParam = params.get('pid');
        if (pidParam) setTimeout(() => { focusOnPid(pidParam); followZoom(); }, 300);
        else followZoom();
    </script>
</body>
