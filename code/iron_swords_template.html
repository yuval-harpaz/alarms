        // column they sit in keeps its width either way, so the names still
        // start together.
        function showDate(iso) {
            const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(iso || '');
            if (!m) return iso || '';
            return (m[3] ? m[3] + '/' : '') + (m[2] ? m[2] + '/' : '') + m[1];
        }

        function dateCell(iso) {
            return '<span class="row-date" dir="ltr">' + showDate(iso) +
                '</span>';
        }

        // By date, earliest first; the family name only breaks ties.
        function sortRows(people, death) {
            return people.slice().sort((a, b) => {
                const da = (death ? (a.dd || a.d) : a.d) || '';
                const db = (death ? (b.dd || b.d) : b.d) || '';
                return da.localeCompare(db) ||
                    familyName(a).localeCompare(familyName(b), RTL ? 'he' : 'en');
            });
        }

        // The date first and in a column of its own, so every name in a list
        // starts at the same place; then the name, then whatever else is worth
        // saying about the person. noRole drops the role where the list is
        // already under a heading that gives it.
        function row(person, death, noRole) {
            const bits = [personLabel(person)];
            if (person.r && !noRole) bits.push(display('r', person.r));
            const note = RTL ? person.note : (person.note_en || person.note);
            if (note) bits.push(note);
            const date = death ? (person.dd || person.d) : person.d;
            return dateCell(date) + ' · ' + bits.join(' · ');
        }

        // The publication that put this place in the open, under the place
        // name. It is why the marker may stand on the exact spot, so the popup
        // credits it and links to it -- the place was published there, not
        // here. Everyone in one popup shares a coordinate, so they share it.
        //
        // An area's own source is about the addresses a ring is drawn over, so
        // it stays off the death marks; a source named for one person is about
        // their case, and where they died is as much of the case as where they
        // were taken from. `srcd` is the second kind. A circle carries neither:
        // it is not an exact place at all.
        function sourceLine(people, death) {
            // Whoever in the group carries it: one coordinate is one area, but
            // two people on it can have their place written differently, and
            // only one of the two spellings need match the published area.
            const person = people.find(p => p.url && (!death || p.srcd));
            if (!person) return '';
            return '<br><a href="' + person.url + '" target="_blank" ' +
                'rel="noopener">' + person.src + '</a>';
        }

        // Every popup on the map, built from one category or several. parts is
        // [{label, people, death, noRole}] -- a heading and a list per
        // category, in the order the mark draws them, each heading carrying its
        // own count and the title carrying the whole. A single category writes
        // no heading: the title already says what the mark is.
        //
        // Nobody is listed twice. A person who turns up in two categories is
        // kept in the first and reported, because the headings have to add up
        // to the title and one name in two lists is one person counted as two.
        // The body scrolls as one, rather than each category getting a box.
        // The breakdown -- 1680 נהרגו · 208 נחטפו חיים -- rides in the title
        // beside the total, where a click has asked for it. On the map itself a
        // mark carries its name and its number and nothing else.
        function partsBreakdown(filled) {
            const named = filled.filter(part => part.short);
            return named.length < 2 ? '' : ': ' + named.map(
                part => part.people.length + ' ' + T[part.short]).join(' · ');
        }

        function partsPopup(place, parts, source) {
            const seen = new Set();
            const twice = [];
            const filled = [];
            parts.forEach(part => {
                const people = (part.people || []).filter(person => {
                    if (seen.has(person.p)) {
                        twice.push(person.p);
                        return false;
                    }
                    seen.add(person.p);
                    return true;
                });
                if (people.length) {
                    filled.push({ label: part.label, people: people,
                                  short: part.short, death: part.death,
                                  noRole: part.noRole });
                }
            });
            if (twice.length) {
                console.warn('one mark listed these in two categories, counted '
                    + 'once: pid ' + twice.join(', '));
            }
            const body = filled.map(part =>
                (filled.length > 1 ? '<b>' + part.label + '</b> (' +
                    part.people.length + ')<br>' : '') +
                sortRows(part.people, part.death)
                    .map(person => row(person, part.death, part.noRole))
                    .join('<br>')).join('<br>');
            const cls = seen.size > SCROLL_OVER ? ' class="popup-scroll"' : '';
            return '<div dir="' + (RTL ? 'rtl' : 'ltr') + '"><b>' + place +
                '</b> (' + seen.size + ')' + partsBreakdown(filled) +
                (source || '') + '<div' + cls + '>' + body + '</div></div>';
        }

        // One kind of person: a marker, a ring, a polygon.
        function popupHtml(people, place, death, noRole, noSource) {
            return partsPopup(place,
                [{ people: people, death: death, noRole: noRole }],
                noSource ? '' : sourceLine(people, death));
        }

        /* ---------------------------------------------------------- the pies */

        // A mark per person says nothing at a distance: Be'eri is 147 of them
        // in eight neighbourhoods that overlap into one smudge. At the locality
        // level a settlement is one filled circle instead, split into the
        // slices of whatever the colours mean just then.
        //
        // A person is counted once, by their event mark. The white x of someone
        // who died somewhere else is drawn only where every mark is drawn, and
        // is never counted here: it is the same person again, at their second
        // place.
        const PIE_ALPHA = 0.6;
        // The green belongs to the survival colouring alone: brighter than
        // the forces' #008000 of the role colouring, so the two views cannot
        // be mistaken for each other, and it holds up on satellite ground.
        const PIE_COLOURS = { red: '#ff0000', blue: '#0000ff',
                              green: '#00cc00' };

        // The settlement is what stands before the first ';': at this distance
        // 'בארי; הכרם' and 'בארי; אשלים' are one place. Grouped on the Hebrew,
        // which every row has, and labelled in the language of the page.
        //
        // Except under a region, which is not a place to put one mark for:
        // grouped on the first segment, everything from Rafah to Beit Lahia
        // lands on the average of the Strip. There the second segment is the
        // settlement, and the English keeps whatever the Hebrew kept.
        //
        // **Every event location of a settlement is in that settlement's one
        // mark**, whether the person stands on a coordinate of their own or on
        // a circle. Gaza City used to be a pie for the addresses we hold and a
        // separate dot for each of Shuja'iyya, Shati, Daraj Tuffah and Rimal --
        // one city drawn five times, and none of the five saying what the city
        // lost. It is one mark of 113 now.
        //
        // What is *not* a settlement stays where it was, and in Israel that is
        // most of what this level draws: 'סמוך למפלסים', 'צומת שער הנגב',
        // 'מיגונית בכניסה לרעים' are open ground named by what they are near,
        // and their first segment is themselves. Nothing folds them into the
        // place they are named after, and nothing should -- that the people
        // were not in that place is the whole of what the mark says.
        const REGIONS = ['רצועת עזה', 'צפון רצועת עזה', 'מרכז רצועת עזה',
                         'דרום לבנון'];

        function splitPlace(name) {
            return (name || '').split(';').map(part => part.trim()).filter(Boolean);
        }

        // How many segments make the settlement. Read off the Hebrew for both
        // languages: every row has it, and the region names are written in it.
        function placeDepth(he) {
            return REGIONS.indexOf(he[0]) > -1 ? 2 : 1;
        }

        function settlement(person) {
            const he = splitPlace(person.loc), en = splitPlace(person.loce);
            const keep = placeDepth(he);
            const heKey = he.slice(0, keep).join('; ');
            const enKey = en.slice(0, keep).join('; ');
            return { key: heKey || enKey,
                     label: RTL ? (heKey || enKey) : (enKey || heKey) };
        }

        // The same, for a circle, which carries a Hebrew name and no person.
        function placeKey(name) {
            const parts = splitPlace(name);
            return parts.slice(0, placeDepth(parts)).join('; ');
        }

        // Blue is taken alive, red is everyone else -- the rule the build draws
        // the marks by, for the people who have no mark of their own.
        function statusColour(person) {
            return (person.s || '').split(';')[0].trim() === 'kidnapped'
                ? 'blue' : 'red';
        }

        // Taken alive and came back: Status opens with kidnapped and carries
        // released or rescued. 'kidnapped; released; died' is a yes -- the
        // captivity was survived, whatever came after.
        function survivedCaptivity(person) {
            const parts = (person.s || '').split(';').map(s => s.trim());
            return parts[0] === 'kidnapped' &&
                (parts.indexOf('released') > -1 ||
                 parts.indexOf('rescued') > -1);
        }

        // What colour the survival view paints a group it cannot split into
        // marks of its own -- a circle's disc: green where everyone under it
        // came back, red where nobody did, and both -- green over red, each
        // holding its share -- where the group holds both answers.
        function survivalPaint(people) {
            const survivors = people.filter(survivedCaptivity).length;
            if (!survivors) return PIE_COLOURS.red;
            if (survivors === people.length) return PIE_COLOURS.green;
            return [{ colour: PIE_COLOURS.green,
                      share: survivors / people.length },
                    { colour: PIE_COLOURS.red,
                      share: (people.length - survivors) / people.length }];
        }

        // The exact kidnapping mark of the survival view: the same outline
        // square drawn to the width of the pngs, in the colour of coming
        // back. Under that view the square holds nobody but survivors, so
        // the icon is one colour and fixed like the pngs beside it.
        const greenIcon = markIcon('square', iconSize / 2 / AREA.square,
                                   { stroke: PIE_COLOURS.green });

        const CIRCLE_POINT = {}, CIRCLE = {};
        CIRCLES.forEach(c => {
            CIRCLE_POINT[c.name_he] = [c.lat, c.lon];
            CIRCLE[c.name_he] = c;
        });

        // What a circle is called on its popups. A too-general circle stands
        // at a chosen point, and its title says so: the place is the Strip,
        // not this spot.
        function circleTitle(c) {
            const name = RTL ? c.name_he : (c.name_en || c.name_he);
            return c.general ? name + ' (' + T.unpublished + ')' : name;
        }

        // Where a person the public map blurred is: their own point is gone,
        // and the ring that replaced it is the only place left to stand.
        const RING_CENTRE = {};
        POLYGONS.forEach(poly => {
            const n = poly.ring.length;
            RING_CENTRE[poly.name_he] = [
                poly.ring.reduce((sum, c) => sum + c[1], 0) / n,
                poly.ring.reduce((sum, c) => sum + c[0], 0) / n];
        });

        // A wedge of the circle, clockwise from twelve o'clock, in turns.
        function wedge(r, from, to) {
            const point = turn => {
                const angle = (turn - 0.25) * 2 * Math.PI;
                return [r + r * Math.cos(angle), r + r * Math.sin(angle)];
            };
            const [x0, y0] = point(from), [x1, y1] = point(to);
            return 'M ' + r + ' ' + r + ' L ' + x0 + ' ' + y0 +
                ' A ' + r + ' ' + r + ' 0 ' + (to - from > 0.5 ? 1 : 0) +
                ' 1 ' + x1 + ' ' + y1 + ' Z';
        }

        // parts is [{n, colour}, ...], drawn clockwise from twelve in the
        // order given and sized by markRadius() of the whole. Two of them for
        // a settlement, two or three for a front, and an empty one is left out
        // rather than drawn as a hairline nobody can see.
        function pieIcon(parts) {
            const filled = parts.filter(part => part.n);
            const total = filled.reduce((sum, part) => sum + part.n, 0);
            const r = markRadius(total);
            const size = 2 * r;
            const fill = (d, colour) => '<path d="' + d + '" fill="' + colour +
                '" fill-opacity="' + PIE_ALPHA + '"/>';
            let shapes;
            if (filled.length === 1) {
                // One kind is a circle, not a pie: an arc of a whole turn
                // starts and ends in the same place and draws nothing.
                shapes = '<circle cx="' + r + '" cy="' + r + '" r="' + r +
                    '" fill="' + filled[0].colour +
                    '" fill-opacity="' + PIE_ALPHA + '"/>';
            } else {
                let from = 0;
                shapes = filled.map(part => {
                    const to = from + part.n / total;
                    const d = wedge(r, from, to);
                    from = to;
                    return fill(d, part.colour);
                }).join('');
            }
            return L.divIcon({
                className: 'pie',
                html: '<svg width="' + size + '" height="' + size +
                    '" viewBox="0 0 ' + size + ' ' + size + '">' + shapes + '</svg>',
                iconSize: [size, size],
                iconAnchor: [r, r]
            });
        }

        // The same, for a death place: a solid triangle, and where more than
        // one colour falls on it, cut into horizontal bands from the apex
        // down, in the order the pie's slices go round. Only the role
        // colouring ever asks for the second -- everywhere else a death place
        // is white.
        //
        // Bands rather than wedges, because the areas have to be the counts.
        // The area of the triangle above a line at depth y from the apex is
        // (y / H)^2 of the whole, so a band that ends at the cumulative share
        // F is cut at y = H * sqrt(F), and every band holds exactly its
        // share of the ink. The pie's wedges clipped to the triangle did not:
        // the wedge aimed at the apex kept a fraction of what a wedge aimed
        // at a corner kept.
        let clipCount = 0;

        function strataSvg(r, parts) {
            const filled = parts.filter(part => part.n);
            const total = filled.reduce((sum, part) => sum + part.n, 0);
            if (filled.length < 2) {
                return markSvg('triangle', r,
                    { fill: (filled[0] || parts[0]).colour, alpha: PIE_ALPHA });
            }
            const box = markBox(r, {});
            const h = r * AREA.triangle;           // half the height
            const top = box / 2 - h, height = 2 * h;
            const id = 'tri' + (++clipCount);
            let share = 0, y = top;
            const bands = filled.map(part => {
                share += part.n / total;
                const bottom = top + height * Math.sqrt(share);
                const rect = '<rect x="0" y="' + y + '" width="' + box +
                    '" height="' + (bottom - y) + '" fill="' + part.colour +
                    '" fill-opacity="' + PIE_ALPHA + '"/>';
                y = bottom;
                return rect;
            }).join('');
            return '<svg width="' + box + '" height="' + box +
                '" viewBox="0 0 ' + box + ' ' + box + '"><defs><clipPath id="' +
                id + '">' + shapePath('triangle', r, box) +
                '/></clipPath></defs><g clip-path="url(#' + id + ')">' +
                bands + '</g></svg>';
        }

        function triangleIcon(parts) {
            const total = parts.reduce((sum, part) => sum + part.n, 0);
            const r = markRadius(total);
            const box = markBox(r, {});
            return L.divIcon({
                className: 'pie', html: strataSvg(r, parts),
                iconSize: [box, box], iconAnchor: [box / 2, box / 2]
            });
        }

        function addPies(red, blue, areas, circles) {
            const groups = {};

            function add(person, coo, place) {
                if (!coo) return;
                place = place || settlement(person);
                const group = groups[place.key] = groups[place.key] ||
                    { label: place.label, people: [], lat: 0, lon: 0, n: 0 };
                group.people.push(person);
                group.lat += coo[0];
                group.lon += coo[1];
                group.n++;
            }

            for (const k in red) red[k].people.forEach(p => add(p, red[k].coo));
            for (const k in blue) blue[k].people.forEach(p => add(p, blue[k].coo));
            for (const name in areas) {
                areas[name].forEach(p => {
                    // pk is the mark the ring replaced. Without one the ring
                    // stands for a white x, and that person is already counted
                    // at their event place.
                    if (p.pk !== 'red' && p.pk !== 'blue') return;
                    add(p, RING_CENTRE[name]);
                });
            }
            // A circle goes the way of the rings: its people have no point of
            // their own, so they join their settlement's pie from where the
            // circle stands. Every circle, not only the ones a settlement
            // already has addresses in -- a city is one mark or it is not a
            // city. The hostages of a circle are not added: they are counted
            // where their event was, and a second count here would be the same
            // person twice.
            // Except on a too-general circle, where the settlement is the
            // circle itself: it joins several names -- the Strip, its north,
            // the perimeter -- and a pie per name would be three pies stacked
            // on one point, each saying it is a place.
            for (const name in circles) {
                const c = CIRCLE[name];
                const place = c && c.general
                    ? { key: placeKey(name), label: circleTitle(c) } : null;
                circles[name].forEach(p => add(p, CIRCLE_POINT[name], place));
            }

            const drawn = new Set();
            for (const k in groups) {
                const group = groups[k];
                placeMark(group.label, group.people,
                          [group.lat / group.n, group.lon / group.n], Pies,
                          { type: 'pie' });
                drawn.add(k);
            }
            return drawn;
        }

        /* ------------------------------------------------ the three levels */

        // How coarsely the map is drawn, from one mark a front to a mark a
        // person. The display panel chooses; the zoom does not, so a level is
        // chosen and kept and zooming into a front mark leaves it a front mark.
        //
        //   fronts   the fronts as the csv keeps them, and the two that
        //            straddle a border split at it: the Strip apart from the
        //            envelope, south Lebanon apart from the northern border
        //   places   a mark per locality -- the pies, the circles that stand
        //            for an area, and the polygons' people inside them
        //   marks    every coordinate of its own: the ring, the square and the
        //            triangle, and a solid one where the place is known no
        //            better
        //
        // There were four. The outermost folded the fronts down to one mark
        // each with the West Bank inside the home front, and it was dropped on
        // 2026-08-19: a map of the whole war at a country's distance is a
        // picture of Israel with a red blot on it and says nothing anyone came
        // for. Its name -- זירות, fronts -- moved down to the level that now
        // opens the map, which is what a front actually is.
        //
        // The first two are coloured by the category button. The last is the
        // marks themselves, which say what they are by their shape, so there is
        // nothing there for a category to colour.
        // Plus 'heat', a development view: not a coarseness of the marks but
        // a picture computed from them, kept in this list because it answers
        // the same question -- how should the map be drawn -- and rides the
        // same radio.
        const LEVELS = ['fronts', 'places', 'marks', 'heat'];

        // The map opens on the level of exact locations. A reader arrives
        // looking for a person or a place, and the coarse views answer a
        // question about the war rather than about anybody in it -- they are
        // worth stepping out to, not worth landing on.
        const LEVEL_DEFAULT = LEVELS.indexOf('marks');
        let level = LEVEL_DEFAULT;

        // Where a level is named in a url that was written before the outermost
        // one went: `regions` was this level's own name, and `fronts` was the
        // one above it. Both mean the level the map now opens on.
        const LEVEL_WAS = { regions: 'fronts' };

        const CATEGORIES = ['status', 'survival', 'roles'];
        const CATEGORY_DEFAULT = 'status';
        let category = CATEGORY_DEFAULT;

        // Which level is which, asked by name rather than by number: the
        // numbers moved when the outermost level went, and every one of these
        // questions was written as a number.
        function lumped() { return level === 0; }
        function atPlaces() { return level === LEVELS.indexOf('places'); }
        function atMarks() { return level === LEVELS.indexOf('marks'); }
        function atHeat() { return LEVELS[level] === 'heat'; }

        function placed(person) {
            return !!(person.red || person.blue || person.white ||
                      person.circ || person.poly || person.dcirc);
        }

        // How many people the levels that draw places could draw. The lumped
        // levels count against the whole file instead.
        const PLACED = PEOPLE.filter(placed).length;

        /* ---------------------------------------------------------- heatmap */

        // Deaths per square kilometre, painted over the tiles: a kernel
        // density. Every death is spread over a disc of the smoothing
        // radius, fading parabolically to nothing at the rim, and the discs
        // sum -- so the picture is a continuum rather than the stacked
        // circles the first cut's max filter drew. Red is the highest
        // density anywhere in the data at the chosen radius, so the scale
        // holds still while the map is panned; ground no kernel reaches is
        // not painted at all.
        let heatSmooth = 2.5;   // km: the kernel radius

        // The radius was settled at 2.5 km with a development slider that is
        // parked behind this flag; flip it to true to play with the radius
        // again.
        const SHOW_SMOOTH_SELECTOR = false;

        // Its own pane: over the tiles at 200, under the boundaries at 350
        // and every mark. Takes no clicks, so the map drags through it.
        map.createPane('heatPane');
        const heatPaneBox = map.getPane('heatPane');
        heatPaneBox.style.zIndex = 260;
        heatPaneBox.style.pointerEvents = 'none';
        const heatCanvas = document.createElement('canvas');
        heatCanvas.style.opacity = 0.5;
        heatCanvas.style.display = 'none';
        heatPaneBox.appendChild(heatCanvas);

        function isDeath(p) {
            const parts = (p.s || '').split(';').map(s => s.trim());
            return parts.indexOf('killed') > -1 || parts.indexOf('died') > -1;
        }

        // Where a death is counted: the event mark, like every count on this
        // map, and the circle or ring of whoever has no point of their own.
        function heatSpot(p) {
            return p.red || p.blue || (p.circ && CIRCLE_POINT[p.circ]) ||
                (p.poly && RING_CENTRE[p.poly]) || null;
        }

        let heatDeaths = [];   // [{lat, lon, w}], one entry per coordinate
        let heatMax = 0;       // deaths per km2, over the whole of the data

        // The top of the colour scale: the densest point anywhere in the
        // data, at the current radius -- a wider kernel flattens the peak,
        // so this is recomputed when the slider moves. Evaluated on a 200 m
        // lattice within 600 m of every point, in flat metres: a density
        // peak stands on or between the points that raise it.
        function computeHeatMax(deaths) {
            if (!deaths.length) return 0;
            const kx = 111320 * Math.cos(deaths[0].lat * Math.PI / 180);
            const ky = 110540;
            const h = heatSmooth * 1000;
            const norm = 2 / (Math.PI * heatSmooth * heatSmooth);
            const pts = deaths.map(d => ({ x: d.lon * kx, y: d.lat * ky,
                                           w: d.w }));
            // A hash of cells the radius wide, so everything within the
            // radius of a spot is in the cell block around the spot's own.
            const hash = new Map();
            pts.forEach(p => {
                const k = Math.round(p.x / h) + ',' + Math.round(p.y / h);
                if (!hash.has(k)) hash.set(k, []);
                hash.get(k).push(p);
            });
            function densityAt(x, y) {
                let sum = 0;
                const ci = Math.round(x / h), cj = Math.round(y / h);
                for (let i = ci - 1; i <= ci + 1; i++) {
                    for (let j = cj - 1; j <= cj + 1; j++) {
                        (hash.get(i + ',' + j) || []).forEach(p => {
                            const dx = p.x - x, dy = p.y - y;
                            const r2 = dx * dx + dy * dy;
                            if (r2 < h * h) sum += p.w * (1 - r2 / (h * h));
                        });
                    }
                }
                return sum * norm;
            }
            const seen = new Set();
            let max = 0;
            const step = 200, reach = 600;
            pts.forEach(p => {
                for (let dx = -reach; dx <= reach; dx += step) {
                    for (let dy = -reach; dy <= reach; dy += step) {
                        const x = p.x + dx, y = p.y + dy;
                        const k = Math.round(x / step) + ',' +
                            Math.round(y / step);
                        if (seen.has(k)) continue;
                        seen.add(k);
                        max = Math.max(max, densityAt(x, y));
                    }
                }
            });
            return max;
        }

        // Blue at zero through cyan, green and yellow to red at the top:
        // hue 240 down to 0 at full saturation, mixed once into a table the
        // pixel loop can read.
        const HEAT_LUT = (function () {
            const lut = [];
            for (let n = 0; n < 256; n++) {
                const hue = 240 * (1 - n / 255);
                const x = 1 - Math.abs((hue / 60) % 2 - 1);
                const rgb = [[1, x, 0], [x, 1, 0], [0, 1, x],
                             [0, x, 1], [x, 0, 1]][Math.min(4, Math.floor(hue / 60))];
                lut.push(rgb.map(v => Math.round(255 * v)));
            }
            return lut;
        }());

        // Gathers whoever the filters allow, and hands back how many.
        function renderHeat() {
            const byCoo = new Map();
            let shown = 0;
            PEOPLE.forEach(p => {
                if (!passes(p) || !isDeath(p)) return;
                const spot = heatSpot(p);
                if (!spot) return;
                shown++;
                const k = spot[0] + ',' + spot[1];
                const found = byCoo.get(k);
                if (found) found.w++;
                else byCoo.set(k, { lat: spot[0], lon: spot[1], w: 1 });
            });
            heatDeaths = [...byCoo.values()];
            heatMax = computeHeatMax(heatDeaths);
            drawHeat();
            renderLegend();
            return shown;
        }

        // Paints the viewport. The field is summed on a lattice a tenth of
        // the kernel radius wide, coloured through the table, and blown up
        // to full size through the canvas's own bilinear smoothing -- the
        // last of the blur, and what makes a lattice read as a continuum.
        function drawHeat() {
            if (!atHeat()) return;
            const size = map.getSize();
            heatCanvas.width = size.x;
            heatCanvas.height = size.y;
            L.DomUtil.setPosition(heatCanvas,
                                  map.containerPointToLayerPoint([0, 0]));
            const ctx = heatCanvas.getContext('2d');

            const mpp = 40075016.686 *
                Math.cos(map.getCenter().lat * Math.PI / 180) /
                Math.pow(2, map.getZoom() + 8);
            const s = heatSmooth * 1000 / mpp;   // kernel radius in px
            const cell = Math.min(16, Math.max(2, s / 14));
            const gridW = Math.ceil(size.x / cell) + 1;
            const gridH = Math.ceil(size.y / cell) + 1;
            const field = new Float32Array(gridW * gridH);
            const s2 = s * s;
            heatDeaths.forEach(d => {
                const p = map.latLngToContainerPoint([d.lat, d.lon]);
                if (p.x < -s || p.x > size.x + s ||
                    p.y < -s || p.y > size.y + s) return;
                const i0 = Math.max(0, Math.ceil((p.x - s) / cell));
                const i1 = Math.min(gridW - 1, Math.floor((p.x + s) / cell));
                const j0 = Math.max(0, Math.ceil((p.y - s) / cell));
                const j1 = Math.min(gridH - 1, Math.floor((p.y + s) / cell));
                for (let j = j0; j <= j1; j++) {
                    const dy = j * cell - p.y;
                    for (let i = i0; i <= i1; i++) {
                        const dx = i * cell - p.x;
                        const r2 = dx * dx + dy * dy;
                        if (r2 < s2) {
                            field[j * gridW + i] += d.w * (1 - r2 / s2);
                        }
                    }
                }
            });

            // The rim of every blob feathers out: the alpha follows the
            // kernel over its outer stretch rather than cutting from paint
            // to nothing at the last lattice cell, which read as a
            // pixelated edge. The field is in kernel units -- one death
            // peaks at 1 -- so the feather is the same stretch of ground on
            // every blob, and a lone death stays as opaque at its centre as
            // a massacre. Zero stays unpainted.
            const FEATHER = 0.5;
            const norm = 2 / (Math.PI * heatSmooth * heatSmooth);
            const image = ctx.createImageData(gridW, gridH);
            const px = image.data;
            for (let n = 0; n < field.length; n++) {
                if (!field[n]) continue;   // zero stays transparent
                const t = heatMax
                    ? Math.min(1, field[n] * norm / heatMax) : 0;
                const rgb = HEAT_LUT[Math.round(255 * t)];
                px[4 * n] = rgb[0];
                px[4 * n + 1] = rgb[1];
                px[4 * n + 2] = rgb[2];
                px[4 * n + 3] = Math.round(
                    255 * Math.min(1, field[n] / FEATHER));
            }
            const buffer = drawHeat.buffer ||
                (drawHeat.buffer = document.createElement('canvas'));
            buffer.width = gridW;
            buffer.height = gridH;
            buffer.getContext('2d').putImageData(image, 0, 0);
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(buffer, 0, 0, gridW, gridH,
                          0, 0, gridW * cell, gridH * cell);
        }

        map.on('moveend zoomend', drawHeat);

        // The number under the cursor: deaths per square kilometre at that
        // spot, worked out from the points directly rather than read off
        // the lattice. Only where there is any paint -- a zero over the sea
        // would be noise -- and only a number: the units are in the legend.
        const heatReadout = document.createElement('div');
        heatReadout.className = 'heat-readout map-label';
        map.getContainer().appendChild(heatReadout);

        function heatValueAt(latlng) {
            const kx = 111320 * Math.cos(latlng.lat * Math.PI / 180);
            const ky = 110540;
            const h = heatSmooth * 1000;
            let sum = 0;
            heatDeaths.forEach(d => {
                const dx = (d.lon - latlng.lng) * kx;
                const dy = (d.lat - latlng.lat) * ky;
                const r2 = dx * dx + dy * dy;
                if (r2 < h * h) sum += d.w * (1 - r2 / (h * h));
            });
            return sum * 2 / (Math.PI * heatSmooth * heatSmooth);
        }

        map.on('mousemove', e => {
            if (!atHeat()) { heatReadout.style.display = 'none'; return; }
            const v = heatValueAt(e.latlng);
            if (!v) { heatReadout.style.display = 'none'; return; }
            heatReadout.textContent = String(Math.round(v * 10) / 10);
            heatReadout.style.display = 'block';
            heatReadout.style.left = (e.containerPoint.x + 14) + 'px';
            heatReadout.style.top = (e.containerPoint.y - 8) + 'px';
        });
        map.on('mouseout', () => { heatReadout.style.display = 'none'; });

        // What the heat view could count, for the header's denominator.
        const HEAT_ALL = PEOPLE.filter(p => isDeath(p) && heatSpot(p)).length;

        // The lumped level splits the two fronts that straddle a border, by the Hebrew
        // place text. A coordinate cannot answer it: someone whose place is no
        // finer than 'דרום לבנון' stands on that region's circle, which is
        // drawn inside Israel. Matched against the start of the place.
        //
        // Jordeikh is named here because the csv writes the village without a
        // country. A raid on one it has not named that way yet lands on the
        // border side, and the fix is to add the name to this list.
        const SPLITS = {
            'Gaza': { inside: 'g_strip', outside: 'g_envelope',
                      places: ['רצועת עזה', 'צפון רצועת עזה',
                               'מרכז רצועת עזה', 'דרום רצועת עזה'] },
            'North': { inside: 'g_lebanon', outside: 'g_north',
                       places: ['דרום לבנון', 'לבנון', "ג'ורדיח"] }
        };

        // The circle a person stands on is asked before their place text: a
        // name too general to be a point is drawn on a circle that says which
        // side it is on -- everything joined onto רצועת עזה is in the Strip,
        // and כביש 234 stands on עוטף עזה, which no place text of its own
        // would say. Somebody with no circle is answered by the text alone.
        function groupKey(person) {
            const front = person.f || T.unspecified;
            const split = SPLITS[front];
            if (!split) return front;
            const names = [person.circ, person.loc]
                .filter(Boolean).map(s => s.trim());
            return names.some(place =>
                split.places.some(name => place.indexOf(name) === 0))
                ? split.inside : split.outside;
        }

        // A key is either one of the split groups, which carry a name of their
        // own, or a front, which carries the csv's.
        function groupLabel(key) {
            if (T[key]) return T[key];
            const renamed = FRONT_LABEL[key];
            return renamed ? (RTL ? renamed.he : renamed.en) : display('f', key);
        }

        // Where a front is drawn when the middle of its cases is the wrong
        // answer. The Iranian strikes fell the length of the country, so their
        // median lands in the middle of it, on top of the home front and saying
        // that the front is a place in Israel. Hand-placed off the coast
        // instead, clear of the marks it would otherwise sit in. Keyed by the
        // raw value in the csv, the one the front filter is built on.
        // g_north and g_envelope are hand-placed for the same reason from the
        // other side: split off from a front, the median of what is left sits
        // on top of the half it was split from -- the northern border over
        // south Lebanon, the envelope over the Strip.
        const FRONT_POINT = {
            'Iran': [32.405473, 34.988708],
            'g_strip': [31.388813, 34.343262],
            'g_envelope': [31.496604, 34.612427],
            'g_north': [33.05932, 35.35675]
        };

        // The name a front carries on its own mark, where the word the filter
        // list uses is not the one a single mark should say: the northern front
        // is the war with Lebanon, and 'north' on a mark drawn over the border
        // reads as a part of Israel. The filters keep the csv's own wording.
        const FRONT_LABEL = { 'North': { he: 'לבנון', en: 'Lebanon' } };

        // Whichever mark a person has, for the median alone: a group is not a
        // place, and this point is chosen to put its mark among its cases, not
        // to say anything about one of them.
        function frontPoint(person) {
            if (person.red) return person.red;
            if (person.blue) return person.blue;
            if (person.circ) return CIRCLE_POINT[person.circ];
            if (person.poly) return RING_CENTRE[person.poly];
            if (person.white) return person.white;
            if (person.dcirc) return CIRCLE_POINT[person.dcirc];
            return null;
        }

        // The median, not the mean: the Gaza front holds a body retrieved in
        // Egypt and the Iran front is answered from Tehran, and an average
        // walks off towards whichever of those is furthest out. The same
        // reason the build frames itself on a box rather than on every point.
        function median(values) {
            const sorted = values.slice().sort((a, b) => a - b);
            const middle = sorted.length >> 1;
            return sorted.length % 2 ? sorted[middle]
                : (sorted[middle - 1] + sorted[middle]) / 2;
        }

        // Worked out once, from everybody in the file rather than from whoever
        // the filters have left: a median that moved with the date slider would
        // walk the Gaza mark up and down the coast as it was dragged, and the
        // mark is meant to say where the front is, not where this week's dead
        // are. One table, the one lumped level having only one grouping.
        // FRONT_POINT still overrides it.
        const GROUP_POINT = (function () {
            const lats = {}, lons = {}, points = {};
            PEOPLE.forEach(person => {
                const point = frontPoint(person);
                if (!point) return;
                const key = groupKey(person);
                (lats[key] = lats[key] || []).push(point[0]);
                (lons[key] = lons[key] || []).push(point[1]);
            });
            for (const key in lats) {
                points[key] = [median(lats[key]), median(lons[key])];
            }
            return points;
        }());

        // How a mark that stands for a group is split, per category: a list of
        // slices drawn clockwise from twelve in the order given. label is the
        // heading in a popup, short is what fits on the map beside a number,
        // and legend is what the key calls the colour -- a place, because that
        // is what the key is about.
        const STATUS_SLICES = [
            { key: 'red', colour: PIE_COLOURS.red, label: 'slice_killed',
              short: 'killed_short', legend: 'killed' },
            { key: 'blue', colour: PIE_COLOURS.blue, label: 'slice_taken',
              short: 'taken_short', legend: 'kidnapped' }
        ];

        // Not the csv's seven roles but the three groups they are spoken about
        // in: the people who were at home and the services that went to them,
        // the police, and the forces -- the army, the Shin Bet and the standby
        // squads, who fought where they lived. Keyed on the csv's own Hebrew,
        // the value the role filter is built on.
        //
        // Orange rather than red for the civilians, because this colouring also
        // paints the death circles, and a red one there reads as the red of the
        // other colouring, which means killed at the event. Green rather than
        // olive, which sat in the satellite tiles and disappeared.
        const ROLE_SLICES = [
            { key: 'civil', colour: '#ff8c00', label: 'role_civil',
              short: 'civil_short', legend: 'role_civil',
              roles: ['אזרח', 'כבאי', 'צוות רפואי'] },
            { key: 'police', colour: '#00e5ff', label: 'role_police',
              short: 'police_short', legend: 'role_police',
              roles: ['שוטר'] },
            { key: 'forces', colour: '#008000', label: 'role_forces',
              short: 'forces_short', legend: 'role_forces',
              roles: ['חייל', 'שב"כ', 'כיתת כוננות'] }
        ];

        function roleSlice(person) {
            const found = ROLE_SLICES.find(
                part => part.roles.indexOf(person.r) > -1);
            return found ? found.key : 'other';
        }

        // A role the csv has just started using would otherwise vanish from a
        // view meant to hold everyone, so it gets a grey slice and a line in
        // the console naming it. Put the role in one of the three groups above
        // and the grey goes away.
        const strayRoles = [...new Set(PEOPLE
            .filter(p => roleSlice(p) === 'other').map(p => p.r || ''))];
        if (strayRoles.length) {
            ROLE_SLICES.push({ key: 'other', colour: '#999999', label: 'others',
                               short: 'others', legend: 'others', roles: [] });
            console.warn('roles in no group of their own, drawn grey: ' +
                strayRoles.join(', '));
        }

        // The survival colouring: who came back. Green is a hostage who
        // survived captivity -- released or rescued, the one who died after
        // coming home included -- and red is everyone else: the people killed
        // wherever they were killed, and the hostages who did not come back
        // alive. The white death marks stay white; where somebody died is not
        // a fact this colouring repaints.
        const SURVIVAL_SLICES = [
            { key: 'red', colour: PIE_COLOURS.red, label: 'slice_lost',
              short: 'killed_short', legend: 'slice_lost' },
            { key: 'green', colour: PIE_COLOURS.green,
              label: 'slice_survived', short: 'survived_short',
              legend: 'slice_survived' }
        ];

        function slices() {
            if (category === 'roles') return ROLE_SLICES;
            if (category === 'survival') return SURVIVAL_SLICES;
            return STATUS_SLICES;
        }

        function sliceKey(person) {
            if (category === 'roles') return roleSlice(person);
            if (category === 'survival') {
                return survivedCaptivity(person) ? 'green' : 'red';
            }
            return statusColour(person);
        }

        // Taken alive and came home: the survivor note the build already
        // writes, and the one group the role colouring leaves out of its
        // counts. They stay on the map wherever the colours are the red and
        // the blue, where blue is the fact of having been taken and says
        // nothing about how it ended.
        const SURVIVORS = PEOPLE.filter(p => p.note).length;
        const PLACED_SURVIVORS = PEOPLE.filter(p => p.note && placed(p)).length;

        // The level of exact locations has no colouring to answer to, so the
        // survivors are on it whichever way the category button was last left.
        function colouredByRole() { return category === 'roles' && !atMarks(); }

        function counted(person) {
            return !colouredByRole() || !person.note;
        }

        function addToGroup(groups, person) {
            const key = groupKey(person);
            const group = groups[key] = groups[key] ||
                { label: groupLabel(key), people: [] };
            group.people.push(person);
        }

        function bySlice(people) {
            const groups = {};
            people.forEach(person => {
                const key = sliceKey(person);
                (groups[key] = groups[key] || []).push(person);
            });
            return groups;
        }

        // What a group's mark says without being clicked: its name and how
        // many people it stands for. The split between them is in the popup,
        // which is what a click is for.
        function groupTooltip(name, total) {
            return '<span dir="' + (RTL ? 'rtl' : 'ltr') + '">' + name + ' ' +
                total + '</span>';
        }

        // Every mark that stands for a group of people: a front, a region, a
        // settlement, or a circle where the address was never established. One
        // pie of the current category's slices, sized by the whole of it and
        // split the way the popup under it is split.
        //
        // opts.name gives the mark its own permanent label -- the group's name,
        // its count and the breakdown -- instead of the bare number the thinning
        // hands out. opts.lazy builds the popup on the click, for the marks
        // whose lists run to thousands of rows.
        function placeMark(label, people, point, layer, opts) {
            opts = opts || {};
            const groups = bySlice(people);
            const parts = slices().map(part => ({
                n: (groups[part.key] || []).length,
                colour: part.colour, short: part.short }));
            const marker = L.marker(point, {
                // A death place keeps its shape whatever the colouring: the
                // triangle is what says the people under it are counted here
                // a second time, at the place they died rather than the place
                // they were taken from.
                icon: opts.death ? triangleIcon(parts) : pieIcon(parts),
                zIndexOffset: stackOrder(people.length)
            });
            const popup = () => partsPopup(label, slices().map(part => ({
                label: T[part.label], people: groups[part.key],
                short: part.short, death: opts.death,
                // Where the colouring is by role, the role is the heading the
                // list is already under.
                noRole: category === 'roles' })));
            marker.bindPopup(opts.lazy ? popup : popup());
            marker.addTo(layer);
            if (opts.name) {
                marker.bindTooltip(groupTooltip(label, people.length),
                                   GROUP_TOOLTIP);
            } else {
                addCount(marker, people.length, point, COUNT_TOOLTIP,
                         { death: opts.death });
            }
            allFeatures.push({ people: people, place: label,
                               death: !!opts.death, layer: marker,
                               type: opts.type || 'place' });
            return marker;
        }

        function drawGroups(groups) {
            for (const key in groups) {
                // A group nobody in the file holds a coordinate for has nowhere
                // to put its mark. Its people are still in the header count.
                const point = FRONT_POINT[key] || GROUP_POINT[key];
                if (!point) continue;
                // Named and counted at every zoom, and outside the thinning the
                // other marks go through: a handful of marks spread over a
                // country are not a crowd, and a group of one is still a group
                // worth naming.
                placeMark(groups[key].label, groups[key].people, point, Pies,
                          { lazy: true, name: true, type: 'group' });
            }
        }

        /* ------------------------------------------------------ the buttons */

        // What a level looks like, in an 18 px box: one mark, two, a scatter of
        // them, and then the marks the finest level is made of.
        function levelIcon(name, r) {
            const u = 2 * r / 18;
            const dot = (x, y, rad) => '<circle cx="' + x * u + '" cy="' +
                y * u + '" r="' + rad * u + '" fill="' + PIE_COLOURS.red +
                '" fill-opacity="' + PIE_ALPHA + '"/>';
            // Two marks and not one: this level is the fronts, and there are
            // several. The single split circle this icon used to be belonged to
            // the level above it, which is gone.
            if (name === 'fronts') return dot(6, 6, 5) + dot(13, 13, 4);
            if (name === 'places') {
                return dot(5, 5, 3) + dot(12, 4, 2) + dot(14, 11, 3) +
                    dot(6, 13, 2.5) + dot(11, 16, 1.5);
            }
            // The heat view: its own ramp, hot centre to cool rim.
            if (name === 'heat') {
                const ring = (rad, colour, alpha) => '<circle cx="' + 9 * u +
                    '" cy="' + 9 * u + '" r="' + rad * u + '" fill="' +
                    colour + '" fill-opacity="' + alpha + '"/>';
                return ring(8, 'hsl(240,100%,50%)', 0.7) +
                    ring(5, 'hsl(120,100%,50%)', 0.85) +
                    ring(2.5, 'hsl(0,100%,50%)', 1);
            }
            // Several kinds of small mark rather than one big one, which is the
            // whole difference between this level and the others.
            return '<circle cx="' + 5.5 * u + '" cy="' + 5.5 * u + '" r="' +
                    3 * u + '" fill="none" stroke="' + PIE_COLOURS.red +
                    '" stroke-width="' + 2 * u + '"/>' +
                '<rect x="' + 11 * u + '" y="' + 2 * u + '" width="' + 5 * u +
                    '" height="' + 5 * u + '" fill="' + PIE_COLOURS.blue + '"/>' +
                // The death mark is white and the panel is white, so this one
                // needs an edge to be there at all.
                '<path d="M ' + 6 * u + ' ' + 10 * u + ' L ' + 9.5 * u + ' ' +
                    17 * u + ' L ' + 2.5 * u + ' ' + 17 * u +
                    ' Z" fill="#fff" stroke="#bbb" stroke-width="' + u + '"/>';
        }

        // The category button wears the colouring it would switch to.
        function categoryIcon(name, r) {
            const list = name === 'roles' ? ROLE_SLICES
                : name === 'survival' ? SURVIVAL_SLICES : STATUS_SLICES;
            const shares = name === 'roles' ? [0.5, 0.62, 1]
                : name === 'survival' ? [0.85, 1] : [0.62, 1];
            let from = 0;
            return list.slice(0, shares.length).map((part, i) => {
                const to = shares[i];
                const d = wedge(r, from, to);
                from = to;
                return '<path d="' + d + '" fill="' + part.colour +
                    '" fill-opacity="' + PIE_ALPHA + '"/>';
            }).join('');
        }

        function svgIcon(inner, r) {
            return '<svg width="' + 2 * r + '" height="' + 2 * r +
                '" viewBox="0 0 ' + 2 * r + ' ' + 2 * r + '">' + inner + '</svg>';
        }

        // One panel, five questions, all of the form "how should this be drawn":
        // which breakdown, what the colours mean, which tiles underneath, which
        // reference layers, how the labels lift off the map. It replaces
        // leaflet's layer control and the three icon buttons that used to stack
        // under it, and it borrows the layer control's own classes so the
        // collapsed button and the hover to open come from leaflet.
        //
        // Radios, not cycling buttons. A button that wears its next click is
        // fine for a two-state toggle and hopeless for four levels: nothing on
        // the screen said which one you were on, and the levels have names
        // worth reading. The level and the colouring are still not remembered
        // between visits -- they are ways of looking at the map, not settings --
        // while the base map and the labels are, being a matter of eyesight and
        // screen.
        const ICON_R = 8;
        let syncPanel = () => {};

        // The address bar mirrors what is on the screen: the level, the
        // colouring, the base map, the filters, and where the map sits. Two
        // things come of that -- a view is shared by copying the url, and the
        // buttons name themselves, since a reader who clicks one watches
        // level=places appear and learns what that level is called.
        // replaceState, so looking around the map does not fill the back
        // button.
        //
        // Only what differs from the page's own defaults is written. A url
        // that names everything is long and says nothing; the bare page is the
        // default view, and a parameter is there because the reader changed
        // something.
        function atHome(centre) {
            const home = map.latLngToLayerPoint(L.latLng(CONFIG.center));
            return map.latLngToLayerPoint(centre).distanceTo(home) < 1.5;
        }

        function anyFilter() {
            return dateField !== 'd'
                || dateFrom.value !== CONFIG.date_min
                || dateTo.value !== CONFIG.date_max
                || FILTER_FIELDS.some(field => selected[field.key].size > 0);
        }

        function viewToUrl() {
            const url = new URL(window.location.href);
            const q = url.searchParams;
            const put = (name, value, isDefault) => {
                if (isDefault) q.delete(name);
                else q.set(name, value);
            };
            put('level', LEVELS[level], level === LEVEL_DEFAULT);
            put('category', category, category === CATEGORY_DEFAULT);
            put('base', baseKey(baseName), baseName === BASE_DEFAULT);
            const layersOn = EXTRA_LAYERS.filter(e => map.hasLayer(e.layer))
                .map(e => e.key);
            put('layers', layersOn.join(','), !layersOn.length);

            for (const name in URL_FILTERS) {
                const key = URL_FILTERS[name];
                const kept = Object.keys(boxes[key])
                    .filter(v => !selected[key].has(v));
                put(name, kept.join(','), selected[key].size === 0);
            }
            put('date', dateField, dateField === 'd');
            put('from', dateFrom.value, dateFrom.value === CONFIG.date_min);
            put('to', dateTo.value, dateTo.value === CONFIG.date_max);

            // A filtered page opening with no view of its own is framed to
            // what it shows, so under a filter the view is always written:
            // the framing would otherwise replace the view the reader had.
            const centre = map.getCenter();
            const filtered = anyFilter();
            // Whichever spelling the reader arrived with stays the one written,
            // so a url never ends up carrying both.
            const key = q.has('centre') && !q.has('center') ? 'centre' : 'center';
            put(key, centre.lat.toFixed(5) + ',' + centre.lng.toFixed(5),
                !filtered && atHome(centre));
            put('zoom', map.getZoom(),
                !filtered && map.getZoom() === CONFIG.zoom);
            // The comma between the coordinates is legal in a query and reads
            // better than %2C in a url meant to be copied into a message.
            history.replaceState(null, '', url.toString().replace(/%2C/g, ','));
        }

        // Everything back the way the page opens: every box ticked, the whole
        // range of dates by event date, the default level, colouring and base
        // map, and the map itself where it started. The url empties with it --
        // a pid it opened on included, since the person is not a default.
        function resetAll() {
            level = LEVEL_DEFAULT;
            category = CATEGORY_DEFAULT;
            setBase(BASE_DEFAULT);
            EXTRA_LAYERS.forEach(e => map.removeLayer(e.layer));
            FILTER_FIELDS.forEach(field => {
                selected[field.key].clear();
                Object.values(boxes[field.key]).forEach(cb => {
                    cb.checked = true;
                });
            });
            dateField = 'd';
            document.querySelector('input[name=datefield][value=d]').checked = true;
            setRange(CONFIG.date_min, CONFIG.date_max, true);
            markActiveCampaign();
            syncPanel();
            renderLegend();
            render();
            map.setView(CONFIG.center, CONFIG.zoom, { animate: false });
            const url = new URL(window.location.href);
            url.search = '';
            history.replaceState(null, '', url.toString());
            viewToUrl();
        }

        function syncButtons() {
            syncPanel();
        }

        const DisplayControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function () {
                const box = L.DomUtil.create('div',
                    'leaflet-control-layers display-control');
                const toggle = L.DomUtil.create('a',
                    'leaflet-control-layers-toggle', box);
                toggle.href = '#';
                toggle.title = T.panel_hint;
                const list = L.DomUtil.create('div',
                    'leaflet-control-layers-list', box);
                if (RTL) list.dir = 'rtl';

                function section(title) {
                    const part = L.DomUtil.create('div', 'panel-section', list);
                    const head = L.DomUtil.create('div', 'panel-head', part);
                    head.textContent = title;
                    return part;
                }

                // A label around the input, so the words are as clickable as
                // the dot -- these words are the only place the levels are
                // named.
                function row(part, group, text, icon, on, pick) {
                    const line = L.DomUtil.create('label', 'panel-row', part);
                    const input = L.DomUtil.create('input', '', line);
                    input.type = group ? 'radio' : 'checkbox';
                    if (group) input.name = group;
                    input.checked = on;
                    if (icon) {
                        L.DomUtil.create('span', 'panel-icon', line)
                            .innerHTML = icon;
                    }
                    L.DomUtil.create('span', '', line).textContent = text;
                    L.DomEvent.on(input, 'change', () => pick(input));
                    return input;
                }

                const levelBox = section(T.panel_display);
                const levelInputs = LEVELS.map((name, index) =>
                    row(levelBox, 'ironLevel', T['level_' + name],
                        svgIcon(levelIcon(name, ICON_R), ICON_R),
                        index === level, () => {
                            level = index;
                            viewToUrl();
                            syncPanel();
                            renderLegend();
                            render();
                        }));

                // The heat view's smoothing radius, while the view is being
                // judged: a development control, meant to go with the number
                // it settles. Shown only while the heat view is on.
                const heatRow = L.DomUtil.create('div', 'heat-slider',
                                                 levelBox);
                const heatSay = L.DomUtil.create('div', 'heat-slider-label',
                                                 heatRow);
                const heatRange = L.DomUtil.create('input', '', heatRow);
                heatRange.type = 'range';
                heatRange.min = 1;
                heatRange.max = 15;
                heatRange.step = 0.5;
                heatRange.value = heatSmooth;
                function sayHeat() {
                    heatSay.textContent = T.heat_smooth + ': ' + heatSmooth +
                        ' ' + T.km;
                }
                sayHeat();
                // The whole of renderHeat, not only the drawing: the top of
                // the scale flattens as the kernel widens, so the maximum
                // and the legend move with the slider.
                L.DomEvent.on(heatRange, 'input', () => {
                    heatSmooth = Number(heatRange.value);
                    sayHeat();
                    renderHeat();
                });

                const catBox = section(T.panel_colour);
                const catInputs = CATEGORIES.map(name =>
                    row(catBox, 'ironCategory', T['cat_' + name],
                        svgIcon(categoryIcon(name, ICON_R), ICON_R),
                        name === category, () => {
                            category = name;
                            viewToUrl();
                            syncPanel();
                            renderLegend();
                            render();
                        }));
                const catNote = L.DomUtil.create('div', 'panel-note', catBox);
                catNote.textContent = T.cat_off;

                const baseBox = section(T.panel_base);
                const baseInputs = BASE_LAYERS.map(([name]) =>
                    [name, row(baseBox, 'ironBase', name, '', name === baseName,
                        () => {
                            setBase(name);
                            viewToUrl();
                        })]);

                const layerInputs = [];
                if (EXTRA_LAYERS.length) {
                    const layerBox = section(T.panel_layers);
                    EXTRA_LAYERS.forEach(extra => {
                        layerInputs.push([extra.layer,
                            row(layerBox, '', extra.name, '',
                                map.hasLayer(extra.layer), input => {
                                    if (input.checked) map.addLayer(extra.layer);
                                    else map.removeLayer(extra.layer);
                                    viewToUrl();
                                })]);
                    });
                }

                const haloBox = section(T.panel_halo);
                haloBox.title = T.halo_hint;
                const haloRow = L.DomUtil.create('div', 'halo-row', haloBox);
                const haloSamples = HALOS.map(([name, css], index) => {
                    const sample = L.DomUtil.create('a',
                        'halo-sample' + (css ? ' ' + css : ''), haloRow);
                    sample.href = '#';
                    sample.title = name;
                    // The letter is a map label, so it is styled by exactly the
                    // rule it is offering.
                    L.DomUtil.create('span', 'map-label', sample)
                        .textContent = 'A';
                    L.DomEvent.on(sample, 'click', L.DomEvent.stop);
                    L.DomEvent.on(sample, 'click', () => {
                        halo = index;
                        applyHalo();
                        markHalo();
                    });
                    return sample;
                });

                function markHalo() {
                    haloSamples.forEach((sample, index) =>
                        sample.classList.toggle('on', index === halo));
                }

                syncPanel = function () {
                    levelInputs.forEach((input, index) => {
                        input.checked = index === level;
                    });
                    // Only the role colouring has nothing to colour where the
                    // marks are the marks: the status colouring is what those
                    // marks already draw, and the survival colouring redraws
                    // them, so both stay in reach at every level. The heat
                    // view has one colouring of its own and answers to none
                    // of these.
                    const off = atMarks();
                    catInputs.forEach((input, index) => {
                        const dead = atHeat() ||
                            (off && CATEGORIES[index] === 'roles');
                        input.checked = CATEGORIES[index] === category;
                        input.disabled = dead;
                        input.parentNode.classList.toggle('off', dead);
                    });
                    catNote.style.display = off ? '' : 'none';
                    heatRow.style.display =
                        SHOW_SMOOTH_SELECTOR && atHeat() ? '' : 'none';
                    baseInputs.forEach(([name, input]) => {
                        input.checked = name === baseName;
                    });
                    layerInputs.forEach(([layer, input]) => {
                        input.checked = map.hasLayer(layer);
                    });
                };

                markHalo();
                syncPanel();

                // Opens on hover like leaflet's own layer control, and on a
                // click as well, which is all a touch screen has.
                L.DomEvent.on(box, 'mouseenter', () =>
                    L.DomUtil.addClass(box, 'leaflet-control-layers-expanded'));
                L.DomEvent.on(box, 'mouseleave', () =>
                    L.DomUtil.removeClass(box,
                        'leaflet-control-layers-expanded'));
                L.DomEvent.on(toggle, 'click', L.DomEvent.stop);
                L.DomEvent.on(toggle, 'click', () =>
                    L.DomUtil.addClass(box, 'leaflet-control-layers-expanded'));
                L.DomEvent.disableClickPropagation(box);
                L.DomEvent.disableScrollPropagation(box);
                return box;
            }
        });

        map.addControl(new DisplayControl());

        function render() {
            [Killed, Kidnapped, Deaths, Circles, HostageCircles, TakenApprox,
             Areas, Pies]
                .forEach(l => l.clearLayers());
            allFeatures = [];
            countMarks = [];

            heatCanvas.style.display = atHeat() ? '' : 'none';
            if (!atHeat()) heatReadout.style.display = 'none';
            if (atHeat()) {
                const heatShown = renderHeat();
                const heatCounts = document.getElementById('counts');
                heatCounts.textContent = heatShown + ' / ' + HEAT_ALL;
                heatCounts.title = T.showing + ' ' + heatShown + ' / ' +
                    HEAT_ALL;
                if (urlFollows) viewToUrl();
                return;
            }

            const red = {}, blue = {}, white = {}, circles = {}, areas = {};
            const approx = {};     // points of our own, drawn solid
            const hostages = {};   // by circle: hostages who died at that place
            const groups = {};     // by front or region, for the lumped levels
            let shown = 0;

            PEOPLE.forEach(p => {
                if (!passes(p)) return;
                // The role colouring is a count of the dead and the still held;
                // the hostages who came home are not in it, at any level.
                if (!counted(p)) return;
                if (lumped()) {
                    // These levels hold everyone the filters allow, the people
                    // with no location at all included: they are carried in the
                    // file for them alone.
                    shown++;
                    addToGroup(groups, p);
                    return;
                }
                // Nothing else can draw someone with no location, so nothing
                // else counts them as shown either.
                if (placed(p)) shown++;
                // A point we hold no better than a village is still a point,
                // and the settlement pies are drawn from it like any other.
                // Only the marks level, where the shape of a mark is the whole
                // of what it says, sets it apart: solid, not an outline.
                //
                // Under the survival colouring the blue square is left to the
                // hostages who came back: the kidnapping point of somebody
                // who did not is their event location, and it is drawn as the
                // red event mark it would be under any other outcome.
                const loose = p.ap && atMarks();
                const event = p.red || p.blue;
                if (event) {
                    const blueish = p.blue && (category !== 'survival' ||
                                               survivedCaptivity(p));
                    const shape = blueish ? 'square' : 'circle';
                    const bag = loose ? approx : (blueish ? blue : red);
                    const k = (loose ? shape + ' ' : '') + key(event);
                    (bag[k] = bag[k] || { coo: event, people: [],
                                          shape: shape }).people.push(p);
                }
                if (p.white) {
                    const k = key(p.white);
                    (white[k] = white[k] || { coo: p.white, people: [] }).people.push(p);
                }
                if (p.circ) (circles[p.circ] = circles[p.circ] || []).push(p);
                if (p.dcirc) (hostages[p.dcirc] = hostages[p.dcirc] || []).push(p);
                if (p.poly) (areas[p.poly] = areas[p.poly] || []).push(p);
            });

            if (lumped()) {
                drawGroups(groups);
            } else if (atPlaces()) {
                // Every event location is in its settlement's pie here -- the
                // addresses, the rings and the circles alike -- so none of them
                // is drawn a second time on its own: that would put the same
                // people in two popups.
                drawCircles(circles, hostages, addPies(red, blue, areas, circles));
            } else {
                addGrouped(red, Killed, redIcon, 'right', 'red-tooltip', false);
                // Under the survival colouring the square and its names are
                // green: everyone still under it came back.
                const surv = category === 'survival';
                addGrouped(blue, Kidnapped, surv ? greenIcon : blueIcon,
                           'left', surv ? 'green-tooltip' : 'blue-tooltip',
                           false);
                drawApprox(approx);
                // The white x is the one mark this level adds and the lumped
                // ones leave out: it is a second mark for someone already
                // counted at their event place, and at a distance it only sat
                // on top of the thing it stands beside.
                addGrouped(white, Deaths, whiteIcon, 'left', 'white-tooltip', true);
                // The rings first: one covers a whole neighbourhood, and drawn
                // over the circles inside it it would take their clicks.
                drawPolygons(areas);
                drawCircles(circles, hostages, null);
            }

            // Only a person with two marks needs a row saying which is which.
            markCount = new Map();
            allFeatures.forEach(f => f.people.forEach(
                p => markCount.set(p.p, (markCount.get(p.p) || 0) + 1)));

            // The head stays one line wide, so the long form is the hover title.
            // The denominator is what the level could draw: the whole file
            // where it is lumped by front, less the survivors where the colours
            // do not count them, and the people with somewhere to stand where
            // the map is drawn by place.
            const drawable = lumped() ? PEOPLE.length : PLACED;
            const total = drawable - (colouredByRole()
                ? (lumped() ? SURVIVORS : PLACED_SURVIVORS) : 0);
            const counts = document.getElementById('counts');
            counts.textContent = shown + ' / ' + total;
            counts.title = T.showing + ' ' + shown + ' / ' + total +
                (CONFIG.unplaced ? '  ·  ' + T.unplaced + ' ' + CONFIG.unplaced : '');
            updateTooltipVisibility();
            applyCounts();
            // Every change of a filter ends here, so this is where the filters
            // reach the url. Not while booting: the boot writes the url once,
            // when the view it arrived at has settled.
            if (urlFollows) viewToUrl();
        }

        // Half a kilometre and a little more, so the two marks of one place can
        // both be clicked and both numbers stand: the margin is what keeps them
        // outside the tightest thinning radius, which is 500 m at street zoom.
        const DEATH_WEST = 600;

        function westOf(lat, lon, metres) {
            return [lat, lon - metres /
                (111320 * Math.cos(lat * Math.PI / 180))];
        }

        // The places known no better than a neighbourhood or a village. The
        // event circle is red like the event marks -- a dot here stands for an
        // area, not for an address, and the difference the orange was drawing
        // is the one thing the shape already says. The death mark is a solid
        // triangle beside it rather than a rim around it: two marks, two popups
        // and two numbers, where the rim could barely be clicked and the one
        // number had to speak for both.
        //
        // White, except where the colouring is by role: everyone on a death
        // circle was taken into the Strip as a civilian, and a white circle in
        // a view of who the people were says nothing about them. There it is
        // drawn like every other mark of that view, which makes it orange.
        // pies is the set of settlements the locality level has drawn a mark
        // for, or null at the level of exact locations, where there are none.
        // At the locality level a circle's people are already inside their
        // settlement's pie, and what is left of the circle here is its death
        // place alone.
        function drawCircles(circles, hostages, pies) {
            const roleDeath = atPlaces() && colouredByRole();
            CIRCLES.forEach(c => {
                const own = circles[c.name_he] || [];
                const people = pies ? [] : own;
                const taken = hostages[c.name_he] || [];
                const name = RTL ? c.name_he : (c.name_en || c.name_he);
                const title = circleTitle(c);
                if (people.length) {
                    if (atPlaces()) {
                        placeMark(title, people, [c.lat, c.lon], Circles,
                                  { type: 'circle' });
                    } else {
                        // An icon and not a vector circle, which is what the
                        // solid mark of a point of our own is too: one shape
                        // drawn one way, and one rule ordering the stack. As a
                        // vector it was ordered by the order it was drawn in
                        // and nothing else could be ordered with it.
                        // Under the survival colouring a circle that holds a
                        // returned hostage says so: the disc takes a blue
                        // band for their share, which is exactly the fact the
                        // one red disc was hiding about pid 964's kind of
                        // case.
                        const circle = L.marker([c.lat, c.lon], {
                            icon: markIcon('circle', markRadius(people.length),
                                           { fill: category === 'survival'
                                                 ? survivalPaint(people)
                                                 : PIE_COLOURS.red,
                                             alpha: PIE_ALPHA }),
                            zIndexOffset: stackOrder(people.length)
                        });
                        circle.bindPopup(partsPopup(title,
                            [{ people: people, noRole: true }]));
                        circle.addTo(Circles);
                        addCount(circle, people.length, [c.lat, c.lon]);
                        allFeatures.push({ people: people, place: name,
                                           death: false, layer: circle,
                                           type: 'circle' });
                    }
                }
                if (!taken.length) return;
                // Moved west where an event mark is already on the spot: on one
                // point the two hide each other's number and only the upper one
                // can be clicked. At the locality level the mark in the way is
                // the settlement's pie, which stands wherever its people
                // average out -- near enough this circle to be worth clearing.
                // Asked of the settlements of the people on the circle, not
                // of the circle's name: on a circle that joins several names
                // (רצועת עזה) nobody's settlement is the circle's own, and the
                // pie in the way is theirs.
                const crowded = pies
                    ? pies.has(placeKey(c.name_he)) ||
                      own.some(p => pies.has(settlement(p).key))
                    : people.length > 0;
                const point = crowded ? westOf(c.lat, c.lon, DEATH_WEST)
                                      : [c.lat, c.lon];
                const label = title + ' · ' + T.died;
                if (roleDeath) {
                    placeMark(label, taken, point, HostageCircles,
                              { death: true, type: 'circle' });
                    return;
                }
                // Not in deathPane, where the exact death mark lives. That pane
                // puts a mark under every event mark whatever their sizes,
                // which is right for the exact one -- it is always 16 px, and a
                // 16 px mark sitting on a small circle hides the thing it
